<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#090b0c">
  <title>Сасфликс для webOS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="launch-screen" class="launch-screen" aria-hidden="true"><img src="largeicon.png" alt=""></div>
  <div id="app" class="app">
    <aside class="side-rail" aria-label="Основная навигация">
      <div id="brand" class="wordmark" aria-label="Сасфликс"><img class="brand-logo" src="largeicon.png" alt=""></div>
      <div class="rail-actions">
        <button id="search-button" class="rail-button focusable" data-focus aria-label="Поиск"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 21 21"></path></svg></button>
        <button id="home-button" class="rail-button focusable selected" data-focus aria-label="Главная"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.2 12 3l9 8.2V21h-6v-6H9v6H3z"></path></svg></button>
        <button id="all-button" class="rail-button focusable" data-focus aria-label="Все видео"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg></button>
        <button id="history-button" class="rail-button focusable" data-focus aria-label="История просмотра"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7v5l3.5 2"></path></svg></button>
      </div>
      <button id="account-button" class="rail-button account-button focusable" data-focus aria-label="Профиль"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c.8-4.2 3.5-6.4 8-6.4s7.2 2.2 8 6.4"></path></svg><span id="account-label" class="visually-hidden">Войти</span></button>
    </aside>
    <div class="page-shell">
      <main id="content">
        <button id="catalog-back" class="catalog-back focusable" data-focus hidden aria-label="Назад к категориям"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"></path></svg><span>Назад</span></button>
        <section id="hero" class="hero focusable" data-focus tabindex="0" role="button" aria-label="Смотреть рекомендуемое видео"></section>
        <section id="continue-section" class="continue-section" hidden><div class="section-heading"><h2>Продолжить просмотр</h2></div><div id="continue-cards" class="continue-cards"></div></section>
        <section class="catalog">
          <div class="section-heading"><h2 id="section-title">Новые выпуски</h2><span id="result-count" class="counter"></span></div>
          <div id="cards" class="cards"></div>
          <div id="loading" class="loading" hidden>Загрузка видео…</div>
          <div id="empty" class="empty" hidden>Видео не найдены.</div>
          <button id="more-button" class="more-button focusable" data-focus hidden>Показать ещё</button>
        </section>
      </main>
      <section id="category-view" class="category-view" hidden aria-label="Категории">
        <button id="category-back" class="category-back focusable" data-focus aria-label="Назад"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"></path></svg><span>Назад</span></button>
        <h1>Категории</h1>
        <div id="categories" class="category-grid"></div>
      </section>
    </div>
  </div>
  <div id="search" class="overlay" hidden><div class="overlay-shade"></div><section class="form-panel" role="dialog" aria-modal="true" aria-label="Поиск"><button id="search-close" class="close focusable" data-focus aria-label="Закрыть"><span class="close-icon"></span></button><span class="eyebrow">ПОИСК</span><h2>Что посмотрим?</h2><div class="search-form"><input id="search-input" class="focusable" data-focus type="search" placeholder="Название, тема или автор" autocomplete="off"><button id="search-submit" class="primary focusable" data-focus>Найти</button></div></section></div>
  <div id="account" class="overlay" hidden><div class="overlay-shade"></div><section class="form-panel" role="dialog" aria-modal="true" aria-label="Аккаунт"><button id="account-close" class="close focusable" data-focus aria-label="Закрыть"><span class="close-icon"></span></button><div id="account-content"></div></section></div>
  <div id="player" class="player" hidden>
    <video id="video" playsinline webkit-playsinline autoplay preload="auto"><source id="video-source"></video>
    <div id="player-ui" class="player-ui">
      <div class="player-top">
        <button id="player-back" class="player-back focusable" data-focus aria-label="Назад"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"></path></svg></button>
        <div class="player-heading"><span class="player-kicker">Сейчас смотрите</span><span id="player-title"></span><span id="player-engine" class="visually-hidden"></span></div>
        <div class="player-brand">SASFLIX</div>
      </div>
      <div class="player-bottom">
        <div id="player-description" class="player-description">0:00 / 0:00</div>
        <div class="timeline">
          <div class="timeline-track"><div id="seek-preview" class="seek-preview" hidden><div id="seek-preview-image" class="seek-preview-image"></div><span id="seek-preview-time">0:00</span></div><div id="buffered" class="buffered-bar"></div><div id="chapter-markers" class="chapter-markers"></div><input id="seek" class="focusable" data-focus type="range" min="0" max="1000" value="0" aria-label="Позиция видео"></div>
          <div id="chapter-title" class="chapter-title"></div>
          <div class="time-row"><span><span id="duration">0:00</span><small id="remaining-time"></small></span></div>
        </div>
        <div class="player-toolbar">
          <div class="player-actions">
            <button id="rewind" class="player-button transport-button seek-button rewind-button focusable" data-focus aria-label="Назад на 15 секунд"><svg class="transport-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M16 13H9V6"></path><path d="M10 13a17 17 0 1 1-2 20"></path><text x="24" y="29" text-anchor="middle">15</text></svg></button>
            <button id="play-pause" class="player-button transport-button play-main focusable" data-focus aria-label="Пауза"><svg class="transport-icon play-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M18 14v20M30 14v20"></path></svg></button>
            <button id="forward" class="player-button transport-button seek-button forward-button focusable" data-focus aria-label="Вперёд на 15 секунд"><svg class="transport-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M32 13H39V6"></path><path d="M38 13a17 17 0 1 0 2 20"></path><text x="24" y="29" text-anchor="middle">15</text></svg></button>
          </div>
          <div class="player-tools"><button id="chapters-toggle" class="chapters-toggle focusable" data-focus aria-haspopup="true" aria-expanded="false" hidden>Таймкоды</button><button id="quality-toggle" class="quality-toggle focusable" data-focus aria-haspopup="true" aria-expanded="false"><strong id="quality-label">Оригинал</strong></button></div>
        </div>
        <div id="player-message" class="player-message"></div>
        <div id="next-up" class="next-up" hidden><span id="next-up-text"></span><button id="next-cancel" class="secondary focusable" data-focus>Отмена</button></div>
        <div id="quality-menu" class="quality-menu" hidden><div class="quality-heading">Качество видео</div><div id="quality-options"></div></div>
        <div id="chapters-menu" class="chapters-menu" hidden><div class="chapters-heading">Таймкоды</div><div id="chapter-list" class="chapter-list"></div></div>
      </div>
      <div id="diagnostics" class="diagnostics" hidden><strong>Диагностика плеера</strong><span id="diagnostics-engine"></span><span id="diagnostics-quality"></span><span id="diagnostics-buffer"></span><span id="diagnostics-state"></span><span id="diagnostics-hls"></span></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="vendor/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
